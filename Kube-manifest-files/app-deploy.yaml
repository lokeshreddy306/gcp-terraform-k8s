apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  namespace: myprofile
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      containers:
        - name: portfolio-app
          image: us-central1-docker.pkg.dev/portfolio-ai-project-495714/portfolio-repo/portfolio-app:v2
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "300Mi"
      #Health Checks for the application pods
          startupProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30 
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            

---
apiVersion: v1
kind: Service
metadata:
 name: portfolio-app
 namespace: myprofile
spec:
  type: ClusterIP
  selector:
    app: portfolio-app
  ports:
    - port: 80
      targetPort: 5000

#Notice the Service type is now ClusterIP. 
#The Google Cloud load balancer will handle public traffic, so you do not need to expose the Flask application through a NodePort manually

  