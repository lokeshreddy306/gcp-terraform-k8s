apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: portfolio-ingress
  namespace: myprofile

  annotations:
    kubernetes.io/ingress.class: gce

spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: portfolio-app
                port:
                  number: 80