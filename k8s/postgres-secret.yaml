#This YAML creates a Kubernetes Secret that stores the credentials and database name PostgreSQL
#Opaque basically means: "This is a generic Secret containing arbitrary key-value data." For database credentials, this is appropriate.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: portfoliodb
#in stringData you can provide the value as normal text, and Kubernetes handles the conversion internally for base64 encoding.