apiVersion: apps/v1
kind: Deployment
metadata: 
  name: portfolio-app
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
  
    spec:
      imagePullSecrets:
        - name: artifact-registry-secret
      containers:
        - name: portfolio-app
          image: us-central1-docker.pkg.dev/portfolio-ai-project-495714/portfolio-repo/portfolio-app:v2
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
